name: Offline regression tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: offline-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Windows'
        run: python -m pip install "tzdata>=2024.1"
      - run: python -m unittest discover -s tests -q
      - run: node --test browser/ashby.test.cjs
